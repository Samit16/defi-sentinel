<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080A">
  <meta name="description" content="A local DeFi security simulation prototype. Demo data only; no contract is compiled or attacked.">
  <title>DeFiSentinel — Local Security Simulation</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2308080A'/%3E%3Cpath d='M13 13h17a19 19 0 1 1 0 38H13z' fill='none' stroke='%238B5CF6' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/"
      }
    }
  </script>
</head>
<body>
  <canvas id="pixelFieldCanvas" aria-hidden="true"></canvas>
  <canvas id="glassCanvas" aria-hidden="true"></canvas>
  <div id="glassFallback" class="glass-fallback" aria-hidden="true"></div>
  <div class="viewport-frame" aria-hidden="true">
    <i class="corner corner--tl"></i><i class="corner corner--tr"></i>
    <i class="corner corner--bl"></i><i class="corner corner--br"></i>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <a class="wordmark" href="#/upload" aria-label="DeFiSentinel home">
        <span class="wordmark-mark" aria-hidden="true">D<span>·</span>S</span>
        <span>DEFISENTINEL</span>
      </a>
      <nav class="step-nav" aria-label="Prototype steps">
        <a href="#/upload" data-step="upload"><span>01</span><b>UPLOAD</b></a>
        <span class="step-rule" aria-hidden="true"></span>
        <a href="#/configure" data-step="configure"><span>02</span><b>CONFIGURE</b></a>
        <span class="step-rule" aria-hidden="true"></span>
        <a href="#/running" data-step="running"><span>03</span><b>RUN</b></a>
        <span class="step-rule" aria-hidden="true"></span>
        <a href="#/report" data-step="report"><span>04</span><b>REPORT</b></a>
      </nav>
      <a class="history-link" href="#/history"><span class="history-dot" aria-hidden="true"></span>HISTORY</a>
    </header>

    <div class="prototype-strip" role="note">
      <span class="strip-index">SYSTEM NOTE <span aria-hidden="true">/</span> 00</span>
      <span>PROTOTYPE: NOTHING IS COMPILED OR ATTACKED. ALL RESULTS ARE SAMPLE DATA.</span>
      <span class="strip-end">LOCAL MODE <span aria-hidden="true">·</span> NO RPC</span>
    </div>

    <main id="app" tabindex="-1" aria-live="polite"></main>

    <footer class="site-footer">
      <span>DEFISENTINEL <span class="muted">/ PRE-LAUNCH CHECK</span></span>
      <span class="footer-center">LOCAL SIMULATION <span aria-hidden="true">·</span> NOT AN AUDIT</span>
      <span class="footer-right">BUILD 0.1.0 <span aria-hidden="true">/</span> SAMPLE DATA</span>
    </footer>
  </div>

  <script type="module" src="js/background.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
